<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Floor plans: 4B · Phone: the plan opens in the picked row</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>

body{margin:0;background:#0d100f}
a{color:#43c07a}a:hover{color:#6fd39a}
.board{
  --ground:#0d100f;--surface:#151917;--raised:#1c211e;
  --ink:#e9ece6;--ink-2:#9aa39d;--ink-3:#6b756f;
  --rule:#262c28;--rule-soft:#1e2320;
  --accent:#43c07a;--accent-soft:#43c07a26;
  --pos:#43c07a;--neg:#ff6257;--warn:#f0913a;--info:#6ea8ff;
  --tip-bg:#e9ece6;--tip-ink:#0d100f;
  width:100%;min-width:1240px;min-height:100vh;box-sizing:border-box;padding:0 0 72px;position:relative;overflow:clip;
  background:var(--ground);color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.board.light{
  --ground:#eef0ea;--surface:#fdfdfb;--raised:#f3f4ef;
  --ink:#15181a;--ink-2:#5b6469;--ink-3:#8b9499;
  --rule:#d2d6cd;--rule-soft:#e0e3da;
  --accent:#00703a;--accent-soft:#00703a1f;
  --pos:#00703a;--neg:#cc2a20;--warn:#c25400;--info:#2a5ea8;
  --tip-bg:#15181a;--tip-ink:#f3f4ef;
}
.board *{box-sizing:border-box}
.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.wrap{width:min(1180px,calc(100% - 80px));margin:0 auto;position:relative;z-index:1}
svg{display:block}

/* everything arrives: sections slide in when they come into view -------- */
.rv{opacity:0;transform:translateY(12px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

/* masthead: wordmark, five places, the clock ------------------------------ */
.mast{display:flex;align-items:center;gap:40px;height:100px;border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:5;background:var(--ground)}
.brand{display:flex;align-items:baseline;gap:2px;user-select:none}
.wordmark{font-size:30px;font-weight:800;letter-spacing:-.045em;line-height:1;cursor:pointer}
.dot{
  display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--accent);
  transform-origin:50% 100%;transition:transform .25s cubic-bezier(.34,1.56,.64,1);cursor:pointer;
}
.brand:hover .dot{transform:translateY(-6px) scale(1.15)}
.dot.spin{animation:coinspin .6s linear}
.dot.kick{animation:kick .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes kick{30%{transform:translateY(-6px) scale(1.8)}60%{transform:scale(.6)}100%{transform:none}}
@keyframes coinspin{from{transform:rotateY(0)}to{transform:rotateY(720deg)}}
.coin{
  position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent);
  pointer-events:none;animation:fall 1.1s cubic-bezier(.2,.7,.4,1) forwards;z-index:9;
}
@keyframes fall{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.6);opacity:0}}
.nav{position:relative;display:flex;gap:4px;margin-left:8px}
.nav a{
  display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:6px;
  color:var(--ink-2);text-decoration:none;font-weight:500;font-size:13.5px;transition:color .15s;
}
.nav a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.nav a:hover svg{transform:translateY(-2px) rotate(-6deg)}
.nav a:hover,.nav a.on{color:var(--ink)}
.nav .ink{
  position:absolute;bottom:-1px;height:2px;background:var(--accent);border-radius:2px;
  left:var(--nx,0);width:var(--nw,0);transition:left .28s cubic-bezier(.4,0,.2,1),width .28s cubic-bezier(.4,0,.2,1);
}
.clock{margin-left:auto;text-align:right;cursor:default}
.clock b{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:16px;letter-spacing:.01em}
.clock b i{font-style:normal;color:var(--ink-3);margin:0 6px}
@keyframes blink{50%{opacity:.25}}
.clock small{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);margin-top:3px}

/* tooltips: the sentence lives here now, not on the page --------------------- */
[data-tip]{position:relative}
[data-tip]::after{
  content:attr(data-tip);position:absolute;left:0;top:calc(100% + 8px);z-index:8;
  background:var(--tip-bg);color:var(--tip-ink);padding:7px 10px;border-radius:5px;
  font:400 12px/1.4 Archivo,sans-serif;white-space:normal;width:max-content;max-width:300px;
  opacity:0;transform:translateY(-3px);pointer-events:none;transition:opacity .15s,transform .15s;
}
[data-tip]:hover::after{opacity:1;transform:translateY(0)}
[data-tip].tr::after{left:auto;right:0}

/* sections ----------------------------------------------------------------- */
.sec{margin-top:44px}
.sechead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sechead h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.sechead .aside{margin-left:auto;display:flex;align-items:center;gap:8px}
.why{
  width:18px;height:18px;border-radius:50%;border:1px solid var(--rule);color:var(--ink-3);
  display:grid;place-items:center;font:500 11px/1 "IBM Plex Mono",monospace;cursor:help;overflow:visible;z-index:30;
}
.why i{font-style:normal;display:block}
.why:hover{color:var(--ink);border-color:var(--ink-3)}
.why:hover i{animation:qdrop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes qdrop{0%{transform:translateY(-16px);opacity:0}100%{transform:none;opacity:1}}
.why::after{left:calc(100% + 12px);top:50%;transform:translate(-6px,-50%)}
.why:hover::after{transform:translate(0,-50%)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;padding:2px;gap:2px;background:var(--surface)}
.seg a{padding:6px 12px;border-radius:5px;font-size:12.5px;font-weight:500;color:var(--ink-2);text-decoration:none;transition:background .15s,color .15s}
.seg a:hover{color:var(--ink)}
.seg a.on{background:var(--ink);color:var(--ground)}
.ibtn{
  width:32px;height:32px;border-radius:7px;border:1px solid var(--rule);background:var(--surface);
  display:grid;place-items:center;color:var(--ink-2);cursor:pointer;transition:color .15s,border-color .15s;
}
.ibtn:hover{color:var(--ink);border-color:var(--ink-3)}
.ibtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.quiet{color:var(--ink-3);font-size:12.5px}
.link{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule);font-size:12.5px}
.link:hover{color:var(--ink);border-color:var(--ink-3)}

/* kpis: a number, a chip, a line ----------------------------------------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:36px}
.kpi{
  position:relative;padding:18px 20px 16px;border-radius:10px;background:var(--surface);
  border:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:8px;
}
.kpi::before{
  content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),var(--accent-soft),transparent 70%);
}
.kpi:hover::before{opacity:1}
.kpi .lab{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1.05}
.kpi .row{display:flex;align-items:center;gap:10px;min-height:20px}
.chip{
  display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;
  font:500 11px/1.5 "IBM Plex Mono",monospace;letter-spacing:.02em;
}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.bad{background:#ff625722;color:var(--neg)}
.chip.warn{background:#f0913a22;color:var(--warn)}
.chip.dim{background:#ffffff10;color:var(--ink-2)}
.light .chip.dim{background:#00000010}
.kpi .sub{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2)}
.spark{position:relative;height:34px;margin-top:2px}
.spark svg{width:100%;height:34px;overflow:visible}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round}
.spark .area{fill:var(--accent);opacity:.08}
.spark .pt{fill:var(--accent);opacity:0;transition:opacity .15s}
.spark .scrub{
  position:absolute;top:-22px;left:0;transform:translateX(-50%);opacity:0;
  font:500 10.5px/1 "IBM Plex Mono",monospace;color:var(--ink);white-space:nowrap;transition:opacity .15s;
}
.kpi:hover .spark .pt,.kpi:hover .spark .scrub{opacity:1}

/* findings: a dot, a verb, a number ------------------------------------- */
.sev{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2);font:500 12.5px/1 "IBM Plex Mono",monospace;border:1px solid transparent;transition:all .15s}
.sev i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sev.crit i{background:var(--neg)}.sev.watch i{background:var(--warn)}.sev.opp i{background:var(--accent)}
.sev:hover{color:var(--ink);border-color:var(--rule)}
.sev.off{opacity:.35}
.finds{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.find{
  display:grid;grid-template-columns:22px 150px 1fr auto 28px;gap:0 14px;align-items:center;
  padding:12px 6px 12px 0;border-bottom:1px solid var(--rule-soft);text-decoration:none;color:inherit;
  transition:background .15s,opacity .35s,transform .35s;border-radius:0 6px 6px 0;
}
.find:hover{background:var(--surface);color:inherit}
.find.gone{opacity:0;transform:translateX(40px);pointer-events:none;max-height:0;padding:0;overflow:hidden;border:none}
.find .mark{width:8px;height:8px;border-radius:50%;justify-self:center;transition:transform .2s cubic-bezier(.34,1.56,.64,1);cursor:pointer;position:relative}
.find .mark::after{content:"";position:absolute;inset:-8px;border-radius:50%}
.find:hover .mark{transform:scale(1.6)}
.find .mark:hover{transform:scale(2.2)}
.find.crit .mark{background:var(--neg)}.find.watch .mark{background:var(--warn)}.find.opp .mark{background:var(--accent)}
.find .site{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.hood{
  display:inline-grid;place-items:center;min-width:24px;height:20px;padding:0 4px;border-radius:4px;
  background:var(--raised);border:1px solid var(--rule);font:600 10px/1 "IBM Plex Mono",monospace;
  letter-spacing:.06em;color:var(--ink-2);flex:none;
}
.find .what{font-weight:600;font-size:14px;color:var(--ink)}
.find .more{
  grid-column:3/5;max-height:0;overflow:hidden;opacity:0;font-size:12.5px;color:var(--ink-2);
  transition:max-height .28s ease,opacity .2s,margin .28s;margin:0;
}
.find:hover .more{max-height:60px;opacity:1;margin-top:4px}
.find .amt{font-family:"IBM Plex Mono",monospace;font-size:13.5px;text-align:right;white-space:nowrap}
.find .amt small{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.find .go{color:var(--ink-3);display:grid;place-items:center;transition:transform .2s,color .15s}
.find .go svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.find:hover .go{color:var(--accent);transform:translateX(3px)}
.find.hide{display:none}
.silenced{margin:12px 0 0;font-size:12.5px;color:var(--ink-3);display:none}
.silenced.on{display:block}

/* next moves: things the board cannot do yet ------------------------------ */
.moves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;perspective:900px}
.move{
  position:relative;padding:20px 20px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--rule-soft);
  text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:10px;
  transform:rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .12s ease-out,border-color .2s;transform-style:preserve-3d;
}
.move:hover{border-color:var(--rule);color:inherit}
.move .ic{
  width:40px;height:40px;border-radius:10px;background:var(--raised);display:grid;place-items:center;color:var(--accent);
  transform:translateZ(24px);transition:transform .2s;
}
.move .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.move b{font-size:15px;font-weight:600;transform:translateZ(16px)}
.move span{font-size:12.5px;color:var(--ink-2);transform:translateZ(10px)}
.move .soon{position:absolute;top:16px;right:16px;font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;color:var(--ink-3);border:1px dashed var(--rule);padding:4px 6px;border-radius:4px}
.move:hover .soon{color:var(--accent);border-color:var(--accent)}
.move.add{border-style:dashed;background:none;justify-content:center;align-items:center;color:var(--ink-3);min-height:120px}
.move.add:hover{color:var(--ink)}

/* tables ----------------------------------------------------------------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule-soft)}
th:first-child,td:first-child,.l{text-align:left}
thead th{font:500 10.5px/1.4 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--rule)}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface)}
tbody td{font-family:"IBM Plex Mono",monospace}
tbody td.l{font-family:Archivo,sans-serif}
tfoot td{font-family:"IBM Plex Mono",monospace;font-weight:600;border-top:1px solid var(--ink);border-bottom:none}
.sub{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;font-family:Archivo,sans-serif}
.chev{display:inline-block;width:16px;vertical-align:-1px;color:var(--ink-3);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
tr.chain{cursor:pointer}
tr.chain:hover .chev{transform:translateX(2px)}
tr.chain.open .chev{transform:rotate(90deg)}
tr.kid{display:none}
tr.kid.show{display:table-row;animation:rowin .3s ease}
@keyframes rowin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
tr.kid td:first-child{padding-left:42px}
tr.bump td{animation:bump .6s ease}
@keyframes bump{0%{background:var(--accent-soft)}100%{background:transparent}}
.grp td{background:var(--raised);font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-2);padding:7px 12px}
.bar{display:inline-block;vertical-align:middle;width:64px;height:4px;border-radius:3px;background:var(--rule);overflow:hidden;margin-right:8px}
.bar i{display:block;height:100%;background:var(--accent);transform-origin:left;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
tr:hover .bar i{transform:scaleX(1.04)}
.set{color:var(--accent);font-weight:600}
.up{display:inline-flex;align-items:center;gap:3px;color:var(--warn);font-size:11px;margin-left:6px;cursor:pointer;padding:2px 6px;border-radius:4px;border:1px solid transparent;transition:all .15s}
.up:hover{border-color:var(--warn)}
.up svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.up.done{color:var(--accent);border-color:transparent}
.check{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent)}
.check svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
td.gauge{position:relative}
td.gauge i{position:absolute;left:12px;right:12px;bottom:6px;height:2px;background:var(--rule);border-radius:2px;overflow:hidden}
td.gauge i b{display:block;height:100%;background:var(--accent);width:var(--w,0);transition:width .5s cubic-bezier(.2,.7,.2,1)}
td.gauge.low i b{background:var(--neg)}

/* charts ----------------------------------------------------------------- */
.chartbox{position:relative;border-radius:10px;background:var(--surface);border:1px solid var(--rule-soft);padding:14px 20px 12px}
.readout{display:flex;justify-content:flex-end;align-items:center;gap:14px;min-height:22px;margin-bottom:6px;font:500 12px/1 "IBM Plex Mono",monospace;color:var(--ink-2)}
.readout b{color:var(--ink);font-weight:500}
.readout i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px;vertical-align:1px}
.legend{display:flex;gap:8px;margin-top:10px}
.legend a{display:inline-flex;align-items:center;gap:7px;padding:4px 9px;border-radius:5px;font-size:12px;color:var(--ink-2);text-decoration:none;border:1px solid transparent;transition:all .15s;cursor:pointer}
.legend a i{width:12px;height:3px;border-radius:2px;background:var(--ink-3);transition:transform .2s}
.legend a.on{color:var(--ink);border-color:var(--rule)}
.legend a:hover{color:var(--ink)}
.legend a:hover i{transform:scaleX(1.4)}
.xh{opacity:0;transition:opacity .12s}
.chartbox:hover .xh{opacity:1}
g[data-series]{transition:opacity .25s}
g[data-series].off{opacity:0}
.chart rect{transition:opacity .15s}
.chart rect:hover{opacity:1}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:end;height:170px;padding-top:30px}
.wd{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.wd .track{position:relative;width:100%;flex:1;display:flex;align-items:center}
.wd .track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--rule)}
.wd .bar2{
  position:absolute;left:18%;right:18%;border-radius:4px;background:var(--accent);
  transform-origin:center;transition:transform .3s cubic-bezier(.34,1.56,.64,1),filter .2s;
}
.wd .bar2.down{background:var(--warn)}
.wd:hover .bar2{transform:scaleX(1.18);filter:brightness(1.15)}
.wd .n{
  position:absolute;left:50%;transform:translate(-50%,4px);padding:3px 7px;border-radius:4px;
  background:var(--ink);color:var(--ground);font:600 11px/1 "IBM Plex Mono",monospace;
  opacity:0;transition:opacity .15s,transform .2s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap;
}
.wd:hover .n{opacity:1;transform:translate(-50%,0)}
.wd .d{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;color:var(--ink-3)}
.wd .d b{display:none;font-weight:500}
.wd:hover .d span{display:none}.wd:hover .d b{display:inline}
.wd.now .d{color:var(--ink)}
.wd.now .track{outline:1px dashed var(--rule);outline-offset:4px;border-radius:6px}

/* heat grid --------------------------------------------------------------- */
.heat{display:grid;grid-template-columns:200px repeat(7,minmax(0,1fr));gap:4px;align-items:center}
.heat .h{font:500 10px/1.3 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding-bottom:6px;transition:color .15s}
.heat .h.hl{color:var(--ink)}
.heat .r{font-size:13px;font-weight:500;padding-right:12px;transition:color .15s}
.heat .r.hl{color:var(--accent)}
.heat .r small{display:block;font-size:11px;color:var(--ink-3);font-weight:400}
.cell{
  position:relative;height:44px;border-radius:6px;display:grid;place-items:center;cursor:pointer;
  font:500 12px/1 "IBM Plex Mono",monospace;color:var(--ink);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s,outline-color .15s,filter .15s;
}
.cell.hl{filter:brightness(1.18)}
.cell:hover{transform:scale(1.12);box-shadow:0 8px 24px #0006;z-index:3}
.cell.picked{outline:2px solid var(--ink);outline-offset:-2px}
.cell .rv2{position:absolute;right:6px;bottom:5px;display:flex;gap:2px}
.cell .rv2 i{width:3px;height:3px;border-radius:50%;background:var(--ink);opacity:.5}
.cell.mine{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.cell::after{top:auto;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,3px)}
.cell:hover::after{transform:translate(-50%,0)}
.celldetail{margin-top:14px;min-height:22px;font-size:13px;color:var(--ink-2)}
.celldetail b{color:var(--ink);font-weight:600}
.celldetail .link{margin-left:10px}

/* waves ------------------------------------------------------------------ */
.waves{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.wave{
  display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:7px;border:1px solid var(--rule);
  font-size:12.5px;color:var(--ink-2);text-decoration:none;background:var(--surface);transition:border-color .15s,color .15s,transform .2s;
}
.wave:hover{color:var(--ink);border-color:var(--ink-3);transform:translateY(-2px)}
.wave b{color:var(--ink);font-weight:600}
.wave .t{font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--ink-3)}
.wave svg{width:12px;height:12px;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none;transition:transform .3s}
.wave.up svg{stroke:var(--accent)}.wave.dn svg{stroke:var(--neg)}
.wave:hover svg{transform:translateY(-2px) scale(1.2)}
.wave.dn:hover svg{transform:translateY(2px) scale(1.2)}

/* plan a chain ------------------------------------------------------------ */
.plan{display:grid;grid-template-columns:300px 1fr;gap:32px;align-items:start}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.field label{font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.field select{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:8px 10px}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.field output{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink)}
.machines{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.machines i{width:22px;height:22px;border-radius:5px;background:var(--rule);transition:background .25s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.machines i.on{background:var(--accent);transform:scale(1)}
.machines i.new{animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.shops{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 14px}
.shops i{width:12px;height:12px;border-radius:3px;background:var(--rule);transition:background .2s}
.shops i.on{background:var(--ink-2)}
.planstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
.planstat{padding:14px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--rule-soft)}
.planstat .lab{font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.planstat .v{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:500;margin-top:8px;letter-spacing:-.02em}
.planstat .v small{font-size:12px;color:var(--ink-3);margin-left:4px;letter-spacing:0}

.step{display:inline-flex;align-items:center;gap:6px}
.step a{width:24px;height:24px;border-radius:6px;border:1px solid var(--rule);display:grid;place-items:center;color:var(--ink-2);text-decoration:none;font:500 14px/1 "IBM Plex Mono",monospace;transition:all .15s}
.step a:hover{color:var(--ink);border-color:var(--ink-3);transform:scale(1.1)}
.step b{font:600 14px/1 "IBM Plex Mono",monospace;min-width:14px;text-align:center}
.step .machines{margin:0 0 0 8px;gap:4px}
.step .machines i{width:14px;height:14px;border-radius:3px}
td .ing{font-size:12px;color:var(--ink-2);white-space:normal;font-family:Archivo,sans-serif}
td .ing b{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink)}
.planline{margin:14px 0 0;font-size:13.5px;color:var(--ink-2)}
.planline b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:500}

/* flow map ---------------------------------------------------------------- */
.flow .node rect{fill:var(--surface);stroke:var(--rule);transition:stroke .15s,transform .2s}
.flow .node{cursor:pointer}
.flow .node:hover rect{stroke:var(--ink-3)}
.flow .node.on rect{stroke:var(--accent);stroke-width:1.5}
.flow .node.faded{opacity:.35}
.flow .node text{font:500 11.5px Archivo,sans-serif;fill:var(--ink)}
.flow .node text.s{font:400 10px "IBM Plex Mono",monospace;fill:var(--ink-3)}
.flow .pipe{fill:none;stroke:var(--ink-3);stroke-opacity:.45;stroke-linecap:round;transition:stroke-opacity .2s,stroke .2s}
.flow .pipe.weekly{stroke-dasharray:6 7}
.flow .pipe:hover,.flow .pipe.lit{stroke:var(--accent);stroke-opacity:1;animation:flowdash .9s linear infinite}
.flow .pipe.daily:hover,.flow .pipe.daily.lit{stroke-dasharray:1 9;stroke-width:3}
.flow .pipe.dim{stroke-opacity:.12}
@keyframes flowdash{to{stroke-dashoffset:-26}}
.flow .cargo{fill:var(--accent);display:none}
.flow .cargo.go{display:block}
.flow .col{font:500 10px "IBM Plex Mono",monospace;letter-spacing:.14em;fill:var(--ink-3)}
.flow .warnd{fill:var(--warn)}.flow .badd{fill:var(--neg)}

/* site detail -------------------------------------------------------------- */
.sitehead{display:flex;align-items:center;gap:16px;margin-top:32px}
.bullet{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:600 12px/1 "IBM Plex Mono",monospace;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.sitehead:hover .bullet{transform:rotate(-12deg) scale(1.08)}
.sitehead h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.sitehead .sub{font-size:13px}
.sstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px}
.sstat{padding:14px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--rule-soft)}
.sstat .lab{font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.sstat .v{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:500;margin-top:8px;letter-spacing:-.02em}
.hours{display:grid;grid-template-columns:40px repeat(24,minmax(0,1fr));gap:3px;align-items:center}
.hours .hh{font:500 9px/1 "IBM Plex Mono",monospace;color:var(--ink-3);text-align:center;padding-bottom:4px}
.hours .dd{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;color:var(--ink-3)}
.hours .dd.now{color:var(--ink)}
.hc{height:20px;border-radius:3px;background:var(--raised);cursor:pointer;transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s}
.hc:hover{transform:scale(1.3);box-shadow:0 4px 14px #0007;z-index:2;position:relative}
.hc.cap{box-shadow:inset 0 0 0 1.5px var(--neg)}
.hc.cap:hover{box-shadow:inset 0 0 0 1.5px var(--neg),0 4px 14px #0007}
.hourread{min-height:22px;margin-top:12px;font:500 12px/1 "IBM Plex Mono",monospace;color:var(--ink-2)}
.hourread b{color:var(--ink);font-weight:500}
.crew{display:flex;flex-wrap:wrap;gap:8px}
.person{display:inline-flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:20px;background:var(--surface);border:1px solid var(--rule-soft);font-size:12.5px;transition:transform .2s}
.person:hover{transform:translateY(-2px)}
.person i{width:22px;height:22px;border-radius:50%;background:var(--raised);display:grid;place-items:center;font:600 9px/1 "IBM Plex Mono",monospace;color:var(--ink-2)}
.person small{color:var(--ink-3)}
.person.off{opacity:.5}
.person.off i{background:#ff625733}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}

/* kinds popover ------------------------------------------------------------ */
.pop{width:520px;margin:40px auto;padding:20px 22px;border-radius:12px;background:var(--surface);border:1px solid var(--rule);box-shadow:0 20px 60px #0008}
.pop h3{margin:0 0 4px;font-size:15px;font-weight:600}
.pop p{margin:0 0 14px;color:var(--ink-3);font-size:12.5px}
.kind{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule-soft)}
.kind:last-of-type{border-bottom:none}
.kind b{font-weight:500;font-size:13.5px}
.kind small{display:block;color:var(--ink-3);font-size:11.5px}
.kind .c{font:500 11px/1 "IBM Plex Mono",monospace;color:var(--ink-3)}
.sw{width:34px;height:20px;border-radius:10px;background:var(--rule);position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(14px);background:#fff}
.pop .foot2{display:flex;justify-content:space-between;align-items:center;margin-top:14px}

/* source strip states -------------------------------------------------------- */
.strip{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--rule-soft);margin-top:14px}
.strip .st{display:flex;align-items:center;gap:10px;font-size:13px}
.strip .st .led{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.strip .st .led.busy{background:var(--info);animation:blink 1s steps(1) infinite}
.strip .st .led.err{background:var(--neg)}
.strip .file{font:400 12px/1 "IBM Plex Mono",monospace;color:var(--ink-3)}
.strip .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.strip .prog{position:relative;width:160px;height:3px;border-radius:2px;background:var(--rule);overflow:hidden}
.strip .prog i{position:absolute;top:0;bottom:0;width:40%;background:var(--info);border-radius:2px;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}
.strip .err{color:var(--neg);font-size:12.5px}
.btn2{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:7px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:500;text-decoration:none;cursor:pointer;transition:border-color .15s,transform .15s}
.btn2:hover{border-color:var(--ink-3);transform:translateY(-1px);color:var(--ink)}
.btn2 svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn2.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn2.primary:hover{color:var(--ground)}
.btn2[aria-disabled="true"]{opacity:.4;pointer-events:none}
.statelabel{font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:32px}

/* company ------------------------------------------------------------------ */
.roles{display:flex;flex-direction:column;gap:8px}
.role{display:grid;grid-template-columns:130px 1fr 44px;gap:12px;align-items:center;font-size:13px}
.role .tr{height:8px;border-radius:4px;background:var(--rule-soft);overflow:hidden}
.role .tr i{display:block;height:100%;background:var(--ink-2);border-radius:4px;transform-origin:left;transition:background .2s,transform .3s cubic-bezier(.2,.7,.2,1)}
.role:hover .tr i{background:var(--accent);transform:scaleX(1.03)}
.role .c{font:500 12px "IBM Plex Mono",monospace;color:var(--ink-2);text-align:right}
.role .c b{display:none;font-weight:500;color:var(--ink)}
.role:hover .c span{display:none}.role:hover .c b{display:inline}
.miles{display:flex;flex-direction:column;gap:2px}
.mile{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule-soft);font-size:13.5px;cursor:pointer}
.mile .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--rule);display:grid;place-items:center;color:var(--ground);transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.mile .box svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mile.done .box{background:var(--accent);border-color:var(--accent)}
.mile:not(.done):hover .box{border-color:var(--accent);transform:rotate(-8deg)}
.mile.just .box{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.mile .c{margin-left:auto;font:500 12px "IBM Plex Mono",monospace;color:var(--ink-3)}
.rules{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.rules span{padding:3px 8px;border-radius:4px;background:var(--raised);font:500 11px "IBM Plex Mono",monospace;color:var(--ink-2);cursor:help}
.rules span b{color:var(--ink);font-weight:600;margin-left:4px}

/* landing ------------------------------------------------------------------ */
.landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:80px 0;perspective:1000px}
.landing .wordmark{font-size:44px}
.landing p{margin:0;color:var(--ink-2);font-size:15px;max-width:460px;text-align:center;text-wrap:pretty}
.drop{
  width:560px;height:280px;border-radius:16px;border:1.5px dashed var(--rule);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;cursor:pointer;transition:border-color .2s,background .2s,transform .12s ease-out;position:relative;
  transform:rotateX(var(--rx,0)) rotateY(var(--ry,0));transform-style:preserve-3d;
}
.drop:hover{border-color:var(--accent);background:var(--surface)}
.drop .folder{width:64px;height:52px;position:relative;transform:translateZ(30px)}
.drop .folder i{position:absolute;inset:0;border-radius:6px;background:var(--raised);border:1.5px solid var(--rule)}
.drop .folder i.tab{width:26px;height:10px;top:-8px;left:0;border-bottom:none;border-radius:6px 6px 0 0}
.drop .folder i.flap{top:10px;transform-origin:50% 100%;transition:transform .35s cubic-bezier(.34,1.56,.64,1);background:var(--surface)}
.drop:hover .folder i.flap{transform:perspective(200px) rotateX(-38deg)}
.drop .folder .file{position:absolute;left:18px;right:18px;top:4px;height:30px;border-radius:3px;background:var(--accent);opacity:0;transform:translateY(8px);transition:all .3s .05s}
.drop:hover .folder .file{opacity:1;transform:translateY(-10px)}
.drop b{font-size:15px;font-weight:600;transform:translateZ(16px)}
.drop span{font-size:12.5px;color:var(--ink-3);transform:translateZ(10px)}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;background:var(--ink);color:var(--ground);
  font-weight:600;font-size:13.5px;text-decoration:none;transition:transform .15s,opacity .15s;
}
.btn:hover{transform:translateY(-1px);opacity:.92;color:var(--ground)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.landing .row{display:flex;align-items:center;gap:18px}
.landing footer{margin-top:40px;display:flex;gap:18px;align-items:center;font:400 11px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--ink-3)}

/* the sphere: the dot grown up. It rolls out of the wordmark onto the masthead
   rule and sits there; it watches the pointer, squishes when clicked and rolls
   along its shelf as the page scrolls ---------------------------------------- */
.orb{position:absolute;left:0;top:0;width:100px;height:100px;z-index:6;cursor:pointer;will-change:transform;opacity:0}
.orb.live{opacity:1}
.orb i{
  display:block;width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at var(--hx,32%) var(--hy,30%),#d9ffe8 0%,#7fe3a8 14%,var(--accent) 38%,#146b3c 78%,#0b3d23 100%);
  box-shadow:0 18px 40px #43c07a3d,inset -14px -20px 34px #00000066,inset 6px 8px 18px #ffffff22;
}
.orb u{
  position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 72% 28%,#0003 0 4.5%,transparent 5.5%),radial-gradient(circle at 26% 62%,#0003 0 3.5%,transparent 4.5%),radial-gradient(circle at 62% 80%,#0002 0 3%,transparent 4%),radial-gradient(circle at 40% 22%,#0002 0 2%,transparent 3%);
}
.orb .squish{animation:squish .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes squish{0%{scale:1 1}25%{scale:1.28 .74}50%{scale:.86 1.18}75%{scale:1.06 .95}100%{scale:1 1}}
.orb::after{content:"";position:absolute;left:14%;right:14%;bottom:-9px;height:14px;border-radius:50%;background:#000;opacity:.45;filter:blur(6px);z-index:-1}
.light .orb::after{opacity:.2}
.landing{position:relative}
.landing .orb{width:360px;height:360px;z-index:0}
.landing .orb i{box-shadow:0 40px 90px #43c07a44,inset -24px -34px 60px #00000066,inset 10px 14px 30px #ffffff22}
.landing .orb::after{bottom:-30px;height:26px;filter:blur(10px)}
.ring{position:absolute;border-radius:50%;border:2px solid var(--accent);pointer-events:none;animation:ring .8s ease-out forwards;z-index:0}
@keyframes ring{from{transform:scale(.6);opacity:.8}to{transform:scale(1.6);opacity:0}}

/* footer ------------------------------------------------------------------- */
.foot{margin-top:64px;padding-top:16px;border-top:1px solid var(--rule);display:flex;gap:22px;font:400 11px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--ink-3)}
.foot span:last-child{margin-left:auto}
/* The map artwork keeps its approved dark palette in either dashboard theme. */
.map-shortcut{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:5px;padding:4px;border:1px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--ink-2);cursor:pointer;line-height:1;flex:none}
.map-shortcut svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.map-shortcut:hover{color:var(--accent);border-color:var(--accent)}
.map-shortcut:focus-visible,.city-map button:focus-visible,.city-map input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* header row: layer chips, the ? mark, search with the live count -------------- */
.map-head{margin-top:28px;position:relative;z-index:1} /* below the sticky masthead when scrolled */
.layers{display:inline-flex;flex-wrap:wrap;gap:2px}
/* Each layer names itself beside its count: "Mine 26 · Owned 0 · Homes 3". */
.sev.lay .lw{color:var(--ink-2)}
.sev.lay .n{color:var(--ink)}
.sev.lay{border:1px solid transparent;background:none;font:500 12.5px/1 "IBM Plex Mono",monospace;appearance:none;-webkit-appearance:none}
.sev.lay.off{opacity:.35}.sev.lay.off:hover{opacity:.6}
.sev.mine i{background:var(--accent)}.sev.own i{background:var(--info)}.sev.home i{background:var(--ink)}.sev.fnd i{background:var(--warn)}.sev.all i{background:transparent;border:1px solid var(--ink-3);box-sizing:border-box}
.srch{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:7px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-3);width:250px;transition:border-color .15s,width .25s;cursor:text}
.srch:focus-within{border-color:var(--ink-3);color:var(--ink-2);width:300px}
.srch svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.srch input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;outline:none;padding:0}
.srch input::placeholder{color:var(--ink-3)}
.srch input::-webkit-search-cancel-button{display:none}
.srch .cnt{font-size:11px;color:var(--ink-3);flex:none}

/* find a location: a mode of the map page --------------------------------------
   One switch decides what is on screen. Off, the page is the plain map and its
   header (.moff). On, the header steps aside and the panel grows a block of
   filters (.fonly) above its results. */
.city-map:not(.finder) .fonly{display:none}
.city-map.finder .moff{display:none}
/* One control, one look. Outlined is "not chosen", filled is "chosen"; nothing
   is ever dimmed, because a dim control reads as one you cannot have. */
.fchip{display:inline-flex;align-items:center;gap:5px;box-sizing:border-box;height:26px;padding:0 9px;
  border:1px solid var(--rule);border-radius:6px;background:none;color:var(--ink-2);
  font:500 11.5px/1 "IBM Plex Mono",monospace;cursor:pointer;white-space:nowrap;
  appearance:none;-webkit-appearance:none;transition:background .15s,border-color .15s,color .15s}
.fchip:hover{color:var(--ink);border-color:var(--ink-3)}
.fchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.fchip b{font-weight:400;color:var(--ink-3)}
.fchip.on b{color:var(--ink-2)}
.fchip.hd{padding:0 8px;letter-spacing:.08em}
/* The switch sits in the map window, in the same button the zoom controls use;
   the accent marks it pressed, the way a layer chip marks itself on. */
.fswitch{position:absolute;left:16px;top:16px;z-index:5}
.fswitch .ibtn{box-shadow:0 2px 8px #0003;width:auto;display:inline-flex;align-items:center;gap:7px;padding:0 12px 0 10px;
  font:500 12.5px/1 Archivo,"Helvetica Neue",Arial,sans-serif;white-space:nowrap}
.fswitch .ibtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* The stage keeps its dark artwork in either theme, so the pressed state tints
   the button's own surface rather than replacing it with a translucent wash. */
.fswitch .ibtn[aria-pressed="true"]{background:color-mix(in oklab,var(--accent) 24%,var(--surface));border-color:var(--accent);color:var(--accent)}
/* The type picker is the page's own select: its own border, the native caret
   replaced by the chevron the rest of the board draws. */
.fsel{position:relative;display:inline-flex;align-items:center}
.fsel select{appearance:none;-webkit-appearance:none;box-sizing:border-box;height:26px;padding:0 26px 0 9px;
  border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink);
  font:500 12.5px Archivo,"Helvetica Neue",Arial,sans-serif;cursor:pointer;max-width:210px;outline:none;
  transition:background .15s,border-color .15s}
.fsel select:hover{border-color:var(--ink-3)}
.fsel select option{color:var(--ink);background:var(--surface)}
.fsel.on select{background:var(--accent-soft);border-color:var(--accent)}
.fsel .fchev{position:absolute;right:8px;display:grid;place-items:center;color:var(--ink-3);transform:rotate(90deg);pointer-events:none}
.fchip.num{color:var(--ink-3);cursor:text}
.fchip.num input{width:34px;border:0;background:none;color:var(--ink);font:inherit;text-align:right;outline:none;padding:0;-moz-appearance:textfield}
.fchip.num input::-webkit-outer-spin-button,.fchip.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fchip.num.on{color:var(--ink-2)}
/* the filter block: the panel's own head, above its results */
.places .filters{flex:none;padding:10px 11px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.frow{display:flex;align-items:center;flex-wrap:wrap;gap:5px}
.frow[hidden]{display:none}
.frow .lab{flex:none;width:46px;font:500 9px/1 "IBM Plex Mono",monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.frow .why{margin-left:auto}
/* Saved searches: each chip carries its own delete, joined to it on the right;
   Save opens a name field beside it, with an x to drop the name. */
.fsaved{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
/* The row can run to two lines; its label stays level with the first. */
.frow.fsaves{align-items:flex-start}
.frow.fsaves .lab{line-height:26px}
/* The chips and the Save controls sit in one wrapping row; only the chips are
   drawn again, so each part is its own element laid out as if it were not. */
.fsaved-list,.fsaved-new{display:contents}
.fsaved [hidden]{display:none}
.fsave{display:inline-flex}
.fsave .fchip{border-radius:6px 0 0 6px}
.fsaved-new:not(.naming) .fnew{border-radius:6px}
.fdel{box-sizing:border-box;width:22px;height:26px;padding:0;display:grid;place-items:center;
  border:1px solid var(--rule);border-left:0;border-radius:0 6px 6px 0;background:none;color:var(--ink-3);
  cursor:pointer;appearance:none;-webkit-appearance:none;transition:background .15s,border-color .15s,color .15s}
.fdel:hover{color:var(--ink);border-color:var(--ink-3)}
.fsave .fchip.on + .fdel{background:var(--accent-soft);border-color:var(--accent)}
.fdel svg,.fnew svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.fchip.fname{cursor:text;border-color:var(--accent)}
.fchip.fname.full{border-color:var(--warn)}
.fchip.fname input{width:150px;border:0;background:none;color:var(--ink);font:inherit;outline:none;padding:0}
.fhead{display:grid;grid-template-columns:26px 24px 1fr 40px 40px 40px 40px 40px 52px;gap:0 5px;padding:10px 8px 8px 6px;border-bottom:1px solid var(--rule-soft);font:500 9px/1 "IBM Plex Mono",monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.fhead span{text-align:right;white-space:nowrap}
.fhead span[data-s]{cursor:pointer}
.fhead span[data-s]:hover{color:var(--ink-2)}
.fhead span:nth-child(-n+3){text-align:left}
.fhead span.on{color:var(--ink)}
.fhead span.on::after{content:" ↓";color:var(--accent)}
/* A header is a span with a button role: the browser's own focus ring lands on
   it after a click and reads as a change to the column. Keyboard focus keeps a
   ring, in the board's own accent. */
.fhead span[data-s]:focus:not(:focus-visible){outline:none}
.fhead span[data-s]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fhead.sale{grid-template-columns:26px 1fr 66px 48px 76px}
.place.fr{grid-template-columns:26px 24px 1fr 40px 40px 40px 40px 40px 52px;gap:0 5px;padding:9px 8px 9px 6px}
/* A warehouse leads with its floor area, so it has one number column fewer. */
.fhead.wh,.place.fr.wh{grid-template-columns:26px 24px 1fr 40px 40px 40px 40px 52px}
.place.fr .rk{display:flex;align-items:center;justify-content:flex-end;gap:3px;font:500 10.5px/1 "IBM Plex Mono",monospace;color:var(--ink-3)}
/* Green is an empty floor to rent, amber a rival to buy out. */
.place.fr .rk i{flex:none;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.place.fr.buy .rk i{background:var(--warn)}
/* A ranked row's second line is why it is where it is, so it never waits for a
   hover the way a plain map row's address does. */
.place.fr .nm small{max-height:none;opacity:1;margin-top:1px;white-space:nowrap}
.place.fr .v{font-family:"IBM Plex Mono",monospace;font-size:12px;text-align:right;color:var(--ink-2);white-space:nowrap}
.place.fr .v.sc{color:var(--ink);font-weight:500}
/* The shaded columns read like the market grid: the stronger the number, the
   more of the accent behind it. What signing costs is left plain — a big
   deposit is not a good one. */
.place.fr .v.sh{border-radius:4px;padding:4px 6px;margin:-4px 0;align-self:center}
.place.fr.sale{grid-template-columns:26px 1fr 66px 48px 76px}
.place.fr.sale .v.t{text-align:left;font-family:inherit;font-size:11.5px;color:var(--ink-3)}
.map-canvas .fp.cand{fill:#43c07a;fill-opacity:.2;stroke:#65e99b;stroke-width:1.2;vector-effect:non-scaling-stroke}
.map-canvas .fp.cand.buy{fill:#e0b84a;fill-opacity:.18;stroke:#f2cf6b}
.stage.finder .map-canvas .fp.mine{fill-opacity:.1;stroke-opacity:.45}
.stage.finder .map-canvas .fp.dim.mine{fill-opacity:.06}
.site .st{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:10px}
.site .st[hidden],.site .facts[hidden],.site .fit[hidden],.site .why[hidden]{display:none}
.site .st i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.site .st.rival i{background:var(--warn)}.site .st.na i{background:var(--ink-3)}
.site .facts{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;margin-top:8px;font-size:11.5px;color:var(--ink-3)}
.site .facts b{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink);float:right}
/* Who owns the place and who trades from it are names, not figures: they take
   the card's own type and the full width. */
.site .facts .wide{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.site .facts .wide b{float:none;font-family:inherit;text-align:right;min-width:0}
.site .facts [data-tip]{cursor:help;border-bottom:1px dotted var(--rule)}
.site .fit{margin-top:8px;font-size:12px;color:var(--ink-2);padding-right:28px}
.site .fit b{color:var(--ink);font-weight:500}
/* The board's ? badge is a circle; inside the card the same class is the
   paragraph that explains the ranking. */
.site .why{width:auto;height:auto;display:block;border:0;border-radius:0;cursor:default;overflow:visible;
  margin:6px 0 0;padding-right:28px;font:400 11.5px/1.45 Archivo,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink-3);text-align:left}
.site .nums .num b.sc{color:var(--accent)}
/* Growth: the pin beside a cell's story opens the finder on that cell. */
.celldetail .link.pin{display:inline-flex;align-items:center;gap:5px;margin-left:10px}
.celldetail .link.pin svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.move .soon.live{border-style:solid;color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}

/* the stage --------------------------------------------------------------------- */
.citymap{position:relative;margin-top:16px;z-index:1} /* its own stacking context: the panel never rides over the sticky masthead */
.citymap.narrow{display:flex;flex-direction:column;gap:12px}
.stage{position:relative;height:720px;border-radius:10px;border:1px solid var(--rule-soft);background:#0d100f;overflow:hidden;user-select:none;-webkit-user-select:none;min-width:0}
.map-canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.map-canvas.dragging{cursor:grabbing}
.map-canvas .fp{fill:transparent;stroke:none;cursor:pointer;transition:fill .2s,stroke .2s}
.map-canvas .fp.mine{fill:#43c07a;fill-opacity:.26;stroke:#65e99b;stroke-width:1.5;vector-effect:non-scaling-stroke}
.map-canvas .fp.owned{fill:#6ea8ff;fill-opacity:.2;stroke:#8fbcff;stroke-width:1.5;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.map-canvas .fp.home{fill:#e9ece6;fill-opacity:.18;stroke:#e9ece6;stroke-width:1.5;vector-effect:non-scaling-stroke}
.stage.all .map-canvas .fp{stroke:#9aa39d;stroke-opacity:.35;stroke-width:1;vector-effect:non-scaling-stroke}
.stage.all .map-canvas .fp.mine{stroke:#65e99b;stroke-opacity:1}
.stage.all .map-canvas .fp.owned{stroke:#8fbcff;stroke-opacity:1}
.stage.all .map-canvas .fp.home{stroke:#e9ece6;stroke-opacity:1}
.map-canvas .fp.dim{fill-opacity:.06;stroke-opacity:.35}
.map-canvas .fp.hot,.map-canvas .fp:hover{fill:#a2f8c4;fill-opacity:.4;stroke:#d9ffe8;stroke-width:2;vector-effect:non-scaling-stroke}
.map-canvas .fp.sel{fill:#65e99b;fill-opacity:.45;stroke:#fff7cc;stroke-width:2.5;vector-effect:non-scaling-stroke}
.map-pips{pointer-events:none}
.pip{display:none;stroke:#0d100f;stroke-width:1.5;vector-effect:non-scaling-stroke}
.stage.zoomed .pip{display:inline}
.pip.crit{fill:#ff6257}.pip.watch{fill:#f0913a}.pip.info{fill:#9aa39d}
.map-fast-background{display:none}
.stage.interacting .map-detail-background{display:none}
.stage.interacting .map-fast-background{display:inline}
.stage.interacting .fp{pointer-events:none}
/* what must not scale with the map sits in an HTML layer over the SVG */
.stage .layer{position:absolute;inset:0;pointer-events:none;z-index:3}
.dlabel{position:absolute;left:0;top:0;font:600 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.16em;color:#bdcbbf;text-shadow:0 0 6px #0d100f,0 0 2px #0d100f;white-space:nowrap;transition:opacity .25s}
.stage.zoomed .dlabel{opacity:0}
.zoomer{position:absolute;right:16px;bottom:16px;z-index:5;display:flex;flex-direction:column;gap:4px}
.stage.panel .zoomer{right:517px}
.citymap.narrow .stage.panel .zoomer{right:16px}
.zoomer .ibtn{font:500 18px/1 "IBM Plex Mono",monospace;box-shadow:0 2px 8px #0003}
/* full screen: the map box takes the screen, the stage the height */
.citymap:fullscreen{background:var(--ground);padding:16px;margin:0;box-sizing:border-box}
.citymap:fullscreen .stage{height:calc(100vh - 32px);border-radius:8px}
.citymap:fullscreen .places{top:32px;right:32px;bottom:32px}
.citymap:fullscreen .stage.panel .zoomer{right:533px}

/* the ball lives in Central Park ------------------------------------------------ */
.ball{position:absolute;left:0;top:0;width:60px;height:60px;z-index:4;cursor:pointer;will-change:transform;transform-origin:50% 100%;pointer-events:auto}
.ball i{display:block;width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at var(--hx,32%) var(--hy,30%),#d9ffe8 0%,#7fe3a8 14%,#43c07a 38%,#146b3c 78%,#0b3d23 100%);
  box-shadow:0 18px 40px #43c07a3d,inset -14px -20px 34px #00000066,inset 6px 8px 18px #ffffff22}
.ball u{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 72% 28%,#0003 0 4.5%,transparent 5.5%),radial-gradient(circle at 26% 62%,#0003 0 3.5%,transparent 4.5%),radial-gradient(circle at 62% 80%,#0002 0 3%,transparent 4%),radial-gradient(circle at 40% 22%,#0002 0 2%,transparent 3%)}
.ball .squish{animation:squish .7s cubic-bezier(.34,1.56,.64,1)}
.ball.spin i{animation:coinspin .6s linear}
.shadow{position:absolute;left:0;top:0;width:88px;height:14px;border-radius:50%;background:#000;opacity:.5;filter:blur(5px);z-index:3;pointer-events:none;transform-origin:50% 50%}

/* places: a floating panel over the map ------------------------------------------ */
.places{position:absolute;top:16px;right:16px;bottom:16px;width:485px;box-sizing:border-box;display:flex;flex-direction:column;z-index:5;border-radius:10px;border:1px solid var(--rule);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden}
.places .list{overflow:auto;overscroll-behavior:contain;flex:1;padding:4px 0;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.places .list::-webkit-scrollbar{width:6px}.places .list::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}.places .list::-webkit-scrollbar-track{background:transparent}
.place{display:grid;width:100%;grid-template-columns:18px 30px 1fr auto;gap:0 8px;align-items:center;padding:9px 12px 9px 8px;border:0;background:none;text-align:left;font:inherit;cursor:pointer;color:var(--ink-2);transition:background .15s,color .15s;position:relative}
.place:hover,.place.hot{background:var(--raised);color:var(--ink)}
.place.on{background:var(--accent-soft);color:var(--ink);box-shadow:inset 3px 0 var(--accent)}
.place .mark{width:7px;height:7px;border-radius:50%;justify-self:center;background:var(--rule);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.place.crit .mark{background:var(--neg)}.place.watch .mark{background:var(--warn)}.place.info .mark{background:var(--ink-3)}
.place:hover .mark{transform:scale(1.6)}
.place .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.place .nm small{display:block;font-size:11px;font-weight:400;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;max-height:0;opacity:0;transition:max-height .2s,opacity .2s,margin .2s}
.place:hover .nm small,.place.on .nm small,.place.hot .nm small{max-height:16px;opacity:1;margin-top:1px}
.place .amt{font-family:"IBM Plex Mono",monospace;font-size:12px;text-align:right;white-space:nowrap}
.place .amt.pos{color:var(--pos)}.place .amt.neg{color:var(--neg)}
.places .more{display:block;width:100%;padding:10px 12px;border:0;border-top:1px solid var(--rule-soft);background:none;text-align:left;font:400 11.5px/1.4 "IBM Plex Mono",monospace;color:var(--ink-3);cursor:pointer}
.places .more:hover{color:var(--ink);background:var(--raised)}
.places .empty{padding:24px 14px;font-size:12.5px;color:var(--ink-3);text-align:center}

/* the site card: opens beside the footprint. Scoped to the map views: the
   board's finding rows wrap business names in a .site span of their own. */
.city-map .site{position:absolute;left:0;top:0;width:290px;z-index:6;border-radius:10px;border:1px solid var(--rule);background:var(--surface);box-shadow:0 12px 40px #0008;padding:14px 16px 14px;opacity:0;pointer-events:none;transition:opacity .25s}
.site.in{opacity:1;pointer-events:auto}
.site[hidden]{display:none}
.site h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;padding-right:26px}
.site .sub{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:12px;color:var(--ink-2)}
.site .x{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:6px;border:0;background:none;display:grid;place-items:center;color:var(--ink-3);cursor:pointer;padding:0}
.site .x:hover{color:var(--ink);background:var(--raised)}
.site .x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.site .nums{display:flex;gap:18px;margin-top:12px}
.site .nums:empty{display:none}
.site .num{display:flex;flex-direction:column;gap:3px}
.site .num b{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:500;letter-spacing:-.02em}
.site .num span{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.site .finds2{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.site .finds2[hidden]{display:none}
.site .f{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--ink-2);line-height:1.4;padding-right:28px}
.site .f i{flex:none;width:7px;height:7px;border-radius:50%;margin-top:5px}
.site .f.crit i{background:var(--neg)}.site .f.watch i{background:var(--warn)}.site .f.info i{background:var(--ink-3)}
.site .f .fa{display:inline-block;font-family:"IBM Plex Mono",monospace;color:var(--ink);margin-left:6px;white-space:nowrap}
.site .f .fa small{font-size:9.5px;letter-spacing:.08em;color:var(--ink-3);margin-left:3px}
.site .num b .pos{color:var(--pos)}.site .num b .neg{color:var(--neg)}
/* "its page": the labelled way to the site's own page, under what the card
   says, so it never sits on a finding's last line. The button's look is the
   board's .ss-pagego. */
.site .go2{display:flex;width:max-content;margin:12px 0 0 auto}
.site .go2[hidden]{display:none}
.site .tail{position:absolute;left:-7px;top:22px;width:12px;height:12px;background:var(--surface);border-left:1px solid var(--rule);border-bottom:1px solid var(--rule);transform:rotate(45deg)}
.site.flip .tail{left:auto;right:-7px;transform:rotate(-135deg)}

.map-status{font-size:12px;color:var(--ink-2);line-height:1.5;margin:8px 0}

/* the shortcut dialog: restyled in the dialog step ------------------------------------ */
.map-dialog{width:min(1120px,calc(100vw - 32px));max-width:none;max-height:calc(100dvh - 32px);box-sizing:border-box;overflow:auto;border:1px solid var(--rule);border-radius:12px;background:var(--ground);color:var(--ink);padding:18px 20px 20px}
.map-dialog::backdrop{background:#000a}
.map-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.map-dialog-head h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.map-dialog .stage{height:560px}
body.map-modal-open{overflow:hidden}
/* The sixth page must remain reachable without widening the document. */
@media(max-width:1100px){
 .wrap .mast{height:auto;min-height:100px;gap:10px 16px;flex-wrap:wrap;padding:12px 0}
 .mast .brand{max-width:45%;min-width:0}
 .mast .wordmark{font-size:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .mast .clock{max-width:50%;margin-left:auto}
 .mast .clock b{font-size:13px}
 .mast .nav{order:3;flex-basis:100%;min-width:0;margin-left:0;flex-wrap:wrap;gap:4px}
 .mast .nav a{padding:8px 10px}
 .mast .nav a.on{background:var(--accent-soft)}
 .mast .nav .ink,.mast .orb{display:none}
}
/* narrow: the panel drops under the stage; the card and chrome keep their places */
@media(max-width:760px){
 .stage{height:52dvh;min-height:300px}
 .citymap.narrow .places{position:static;width:auto;max-height:45dvh;backdrop-filter:none;background:var(--surface)}
 /* The filters alone can outgrow a phone's panel, so there the panel scrolls
    as one piece and the results follow the filters. */
 .citymap.narrow .places{overflow-y:auto;overscroll-behavior:contain}
 .citymap.narrow .places .list{flex:none;overflow:visible}
 .fhead,.place.fr{grid-template-columns:26px 24px 1fr 38px 38px 38px 38px 38px 50px}
 .fhead.wh,.place.fr.wh{grid-template-columns:26px 24px 1fr 38px 38px 38px 38px 50px}
 .fhead.sale,.place.fr.sale{grid-template-columns:24px 1fr 58px 42px 68px}
 /* A text field under 16px makes a phone browser zoom the page in on focus. */
 .fchip,.fdel{height:32px}
 .fdel{width:30px}
 .frow.fsaves .lab{line-height:32px}
 .fchip.num input,.fchip.fname input{font-size:16px}
 .fsel select{height:32px;font-size:16px}
 .map-head .aside{flex-basis:100%}
 /* The named chips wrap onto a second line; the ? stays beside them. */
 .map-head > .layers{flex:1 1 0;min-width:0}
 .sev.lay{padding:6px 7px;gap:5px}
 .srch,.srch:focus-within{width:100%}
 .srch input{font-size:16px}
 .map-dialog{width:calc(100vw - 12px);max-height:calc(100dvh - 12px);padding:12px}
 .map-dialog .stage{height:60dvh}
}
/* On a phone the fixed columns would leave the address nothing. Traffic,
   demand, floor area and cap step aside — they are still on the card, and the
   score is the reason the row is where it is. */
@media(max-width:600px){
 .fhead:not(.sale),.place.fr:not(.sale){grid-template-columns:28px 24px 1fr 42px 56px}
 .fhead:not(.sale):not(.wh) span:nth-child(n+5):nth-child(-n+8),
 .place.fr:not(.sale):not(.wh) > :nth-child(n+5):nth-child(-n+8),
 .fhead.wh span:nth-child(n+5):nth-child(-n+7),
 .place.fr.wh > :nth-child(n+5):nth-child(-n+7){display:none}
 .fhead.sale,.place.fr.sale{grid-template-columns:24px 1fr 44px 70px}
 .fhead.sale span:nth-child(3),.place.fr.sale > :nth-child(3){display:none}
}
@media(pointer:coarse){.map-shortcut{min-width:32px;min-height:32px}.city-map .ibtn,.place{min-height:44px}}

.board.lp-board{padding:0 0 40px;min-height:0}
.board.lp-board.lp-small{min-width:0}
.board svg{flex:none}
.lp-page{padding-top:28px}
.lp-finder .citymap{margin-top:0}
/* the world the stage pans over: the map crop and its footprints */
.lp-stage{background:#0d100f}
.lp-world{position:absolute;left:0;top:0;transition:transform .55s cubic-bezier(.4,0,.2,1);will-change:transform}
.lp-world img{display:block;pointer-events:none}
.lp-world .lp-fps{position:absolute;left:0;top:0}
.lp-fps .fp{fill:transparent}
.lp-fps .fp.cand{fill:#43c07a;fill-opacity:.2;stroke:#65e99b;stroke-width:1.2;vector-effect:non-scaling-stroke}
.lp-fps .fp.hot{fill:#a2f8c4;fill-opacity:.4;stroke:#d9ffe8;stroke-width:2}
.lp-fps .fp.sel{fill:#65e99b;fill-opacity:.45;stroke:#fff7cc;stroke-width:2.5}
.lp-layer{pointer-events:none}
.lp-layer .site{pointer-events:auto}
.city-map .lp-site .st,.city-map .lp-site .facts,.city-map .lp-site .fit{display:grid}
.city-map .lp-site .st{display:inline-flex}
.city-map .lp-site .fit{display:block}
.city-map .lp-site .hood{height:18px;min-width:22px;font-size:9.5px;margin-right:2px}

/* the row's layout tag, and the pin a pinned row wears */
.lp-tag{display:inline-block;margin-right:6px;padding:1px 4px;border-radius:3px;border:1px solid var(--rule);font:500 9.5px/1.2 "IBM Plex Mono",monospace;color:var(--ink-2);letter-spacing:.02em}
.place.on .lp-tag{border-color:color-mix(in srgb,var(--accent) 55%,var(--rule));color:var(--ink)}
.lp-pinmark{display:inline-grid;place-items:center;margin-left:6px;color:var(--accent);vertical-align:-2px}
.lp-pinmark[hidden]{display:none}
.lp-pinmark svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* the plan itself: the board's tokens, nothing louder than the map */
.lp-svg .f{fill:color-mix(in oklab,var(--ink) 15%,var(--surface))}
.lp-svg .b{fill:var(--ground)}
.lp-svg .w{fill:var(--ink-2)}
.lp-svg .n{fill:var(--info)}
.lp-svg .d{fill:var(--accent)}
.lp-scale{display:inline-flex;align-items:center;gap:6px;font:500 10px/1 "IBM Plex Mono",monospace;color:var(--ink-3);white-space:nowrap}
.lp-scale i{display:block;height:6px;border:1.5px solid var(--ink-3);border-top:0;box-sizing:border-box}
.lp-lab{display:inline-flex;align-items:center;gap:6px;font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.lp-lab svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* the dock: bottom-left of the map area, where the player asked for it */
.lp-dock{position:absolute;left:16px;bottom:16px;z-index:6}
.lp-card{display:grid;grid-template-columns:236px 164px;gap:0 14px;width:442px;padding:12px 14px 12px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);box-shadow:0 12px 40px #0008;animation:lp-in .22s cubic-bezier(.2,.7,.2,1)}
.lp-card.lp-off{display:none}
@keyframes lp-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lp-box{height:190px;border-radius:7px;background:var(--ground);display:grid;place-items:center;overflow:hidden}
.lp-side{display:flex;flex-direction:column;gap:9px;min-width:0}
.lp-state{display:flex;align-items:center;gap:6px;font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.lp-state i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.lp-state .lp-why{margin-left:auto;letter-spacing:0}
.lp-state .lp-why::after{left:auto;right:0;text-transform:none;letter-spacing:0}
.lp-state [data-when="hover"]{display:none}
.lp-card.hover .lp-state i{background:transparent;border:1.5px solid var(--ink-3)}
.lp-card.hover .lp-state [data-when="hover"]{display:inline}
.lp-card.hover .lp-state [data-when="pick"]{display:none}
.lp-code{display:flex;align-items:baseline;gap:8px;min-width:0}
.lp-code>b{font:500 24px/1 "IBM Plex Mono",monospace;letter-spacing:-.02em;color:var(--ink)}
.lp-code>span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-addr{font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-3px}
.lp-nums{display:flex;gap:14px}
.lp-nums div{display:flex;flex-direction:column;gap:3px}
.lp-nums b{font:500 16px/1 "IBM Plex Mono",monospace;letter-spacing:-.02em;color:var(--ink)}
.lp-nums span{font:500 9.5px/1.1 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.lp-foot{display:flex;align-items:center;gap:10px;margin-top:auto}
.lp-hint2{margin:0;font-size:11.5px;line-height:1.4;color:var(--ink-3)}
.lp-card.hover .lp-hint2{visibility:hidden}
.lp-dim{font:400 10.5px/1 "IBM Plex Mono",monospace;color:var(--ink-3);white-space:nowrap}
.lp-pinbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--rule);background:none;color:var(--ink-2);font:500 11.5px/1 "IBM Plex Mono",monospace;cursor:pointer;width:max-content;transition:color .15s,border-color .15s,background .15s}
.lp-pinbtn:hover{color:var(--ink);border-color:var(--ink-3)}
.lp-pinbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.lp-pinbtn svg,.lp-unpin svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lp-pinbtn.sm{height:22px;padding:0 7px;font-size:10.5px;margin-left:auto}

/* option A: the tray of pinned plans */
.lp-tray{width:max-content;max-width:640px;padding:10px 12px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);box-shadow:0 12px 40px #0008}
.lp-trayhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lp-traynote{font-size:11.5px;color:var(--ink-3)}
.lp-trayhead .lp-scale{margin-left:auto}
.lp-slots{display:flex;gap:10px;align-items:stretch}
.lp-slot{width:196px;display:flex;flex-direction:column;gap:7px;padding:8px;border-radius:8px;background:var(--ground);border:1px solid var(--rule-soft);animation:lp-in .22s cubic-bezier(.2,.7,.2,1)}
.lp-slot.live{border-style:dashed;border-color:var(--rule)}
.lp-slot.live.hover{border-color:var(--ink-3)}
.lp-slotbox{height:160px;display:flex;align-items:flex-end;justify-content:center}
.lp-slothead{display:flex;align-items:baseline;gap:7px;min-width:0}
.lp-slothead>b{font:500 15px/1 "IBM Plex Mono",monospace}
.lp-slothead>span{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.lp-unpin{flex:none;width:22px;height:22px;display:grid;place-items:center;border:0;border-radius:5px;background:none;color:var(--ink-3);cursor:pointer;padding:0}
.lp-unpin:hover{background:var(--raised);color:var(--ink)}
.lp-slotnums{display:flex;gap:10px;font:400 10.5px/1 "IBM Plex Mono",monospace;color:var(--ink-3)}
.lp-slotnums b{font-weight:500;color:var(--ink)}

/* option B: the shelf of layouts */
.lp-shelf{padding:10px 12px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);box-shadow:0 12px 40px #0008;width:max-content;max-width:646px}
.lp-tiles{display:flex;gap:8px;align-items:stretch}
.lp-shelf.wrap .lp-tiles{display:grid;grid-template-columns:repeat(6,auto);justify-content:start}
.lp-tile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 7px 6px;border-radius:8px;border:1px solid transparent;background:var(--ground);color:var(--ink-2);cursor:pointer;font:inherit;transition:border-color .15s,background .15s,transform .2s cubic-bezier(.34,1.56,.64,1)}
.lp-tile:hover{border-color:var(--ink-3);transform:translateY(-2px)}
.lp-tilebox{display:flex;align-items:flex-end;justify-content:center;min-width:34px}
.lp-tilecode{display:flex;align-items:baseline;gap:5px;font:400 10px/1 "IBM Plex Mono",monospace;color:var(--ink-3);white-space:nowrap}
.lp-tilecode b{font-size:13px;font-weight:500;color:var(--ink)}
.lp-tilen{font:400 10px/1 "IBM Plex Mono",monospace;color:var(--ink-3)}
.lp-tile.none{opacity:.55}
.lp-tile.lit{border-color:var(--accent);background:var(--accent-soft)}
.lp-tile.lit .lp-svg .f{fill:color-mix(in oklab,var(--accent) 22%,var(--surface))}
.lp-tile.hover{border-color:var(--ink-3)}
.lp-tile.hover .lp-svg .f{fill:color-mix(in oklab,var(--ink) 16%,var(--surface))}
.lp-tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lp-laychips{display:flex;flex-wrap:wrap;gap:5px}
.lp-hint{font:400 11.5px/26px Archivo,sans-serif;color:var(--ink-3)}
.place.fr.lp-gone{display:none}
.lp-aside{margin:36px auto 0;width:min(1180px,calc(100% - 80px));display:flex;gap:28px;align-items:flex-start}
.lp-asidehead{width:260px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.lp-asidehead b{color:var(--ink);font-size:14px}
.lp-asidebox .lp-shelf{box-shadow:none}

/* phones: the map is a strip over the list; no hover, only a pick */
.lp-phone{width:390px}
.lp-pmast{display:flex;align-items:center;gap:2px;height:56px;padding:0 16px;border-bottom:1px solid var(--rule)}
.lp-pmast .wordmark{font-size:22px}
.lp-pmast .dot{width:8px;height:8px}
.lp-pnav{display:inline-flex;align-items:center;gap:6px;margin-left:16px;font-size:13px;font-weight:500;color:var(--ink)}
.lp-pnav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lp-pclock{margin-left:auto;font:500 11px/1 "IBM Plex Mono",monospace;color:var(--ink-3)}
.lp-phone .citymap.narrow{display:flex;flex-direction:column;gap:10px;padding:10px 0 0;margin:0}
.lp-phone .stage.lp-pstage{height:360px;border-radius:0;border-left:0;border-right:0}
.lp-phone .fswitch{left:10px;top:10px}
.lp-phone .places.lp-pplaces{position:static;width:auto;max-height:none;backdrop-filter:none;background:var(--surface);border-radius:0;border-left:0;border-right:0}
.lp-phone .places .list{overflow:visible}
.lp-phone .fhead,.lp-phone .place.fr{grid-template-columns:28px 24px 1fr 42px 56px}
.lp-phone .fhead span:nth-child(n+5):nth-child(-n+8),.lp-phone .place.fr>:nth-child(n+5):nth-child(-n+8){display:none}
.lp-phone .place{min-height:44px}
.lp-phone .fchip{height:32px}
.lp-pfilters .frow{flex-wrap:nowrap;overflow:hidden}
.lp-seg{position:absolute;right:10px;top:10px;z-index:6;display:flex;padding:3px;border-radius:9px;background:var(--surface);border:1px solid var(--rule);box-shadow:0 2px 8px #0003}
.lp-seg button{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border:0;border-radius:6px;background:none;color:var(--ink-2);font:500 13px/1 Archivo,sans-serif;cursor:pointer}
.lp-seg button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lp-seg button.on{background:var(--accent-soft);color:var(--ink)}
.lp-phoneplan{position:absolute;inset:0;z-index:5;background:var(--surface);display:flex;flex-direction:column;padding:58px 14px 12px;gap:10px}
.lp-phoneplan[hidden]{display:none}
.lp-ppbox{flex:1;display:grid;place-items:center;border-radius:8px;background:var(--ground);min-height:0;overflow:hidden}
.lp-pphead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.lp-pphead .lp-code{flex-basis:100%}
.lp-pphead .lp-foot{margin-left:auto;margin-top:0}
.lp-rowplan{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:6px 12px 14px 14px;background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent)}
.lp-rpbox{height:160px;display:grid;place-items:center;border-radius:7px;background:var(--surface)}
.lp-rpside{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.lp-rpside .lp-code>b{font-size:20px}

/* reference sheets: legend, orientation, the 24 layouts */
.lp-sheet{padding:44px 56px 56px}
.lp-sheethead h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em}
.lp-sheethead p{margin:6px 0 0;max-width:820px;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.lp-sheet h2{margin:28px 0 12px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:12px}
.lp-sheet h2 small{display:inline-flex;align-items:center;gap:12px;font:400 11.5px/1 "IBM Plex Mono",monospace;color:var(--ink-3)}
.lp-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px}
.lp-legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:13px;color:var(--ink-2)}
.lp-legend li{display:flex;align-items:center;gap:10px}
.lp-sw{border-radius:4px;border:1px solid var(--rule)}
.lp-p{margin:12px 0 0;font-size:13px;line-height:1.5;color:var(--ink-2);max-width:520px}
.lp-scales{display:flex;gap:28px;align-items:center}
.lp-themes{display:flex;gap:12px}
.lp-theme.board{min-width:0;min-height:0;padding:0;width:auto;background:transparent}
.lp-legcard{display:flex;gap:14px;align-items:center;padding:12px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink)}
.lp-legside{display:flex;flex-direction:column;gap:8px;min-width:130px}
.lp-legside>b{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.lp-legside .lp-code>b{font-size:20px}
.lp-orients{display:flex;gap:24px;align-items:flex-start;margin-top:14px}
.lp-orient{margin:0;width:260px;display:flex;flex-direction:column;align-items:center;gap:8px}
.lp-obox{width:260px;height:240px;display:grid;place-items:center}
.lp-street{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.lp-street i{width:180px;height:0;border-top:2px dashed var(--ink-3)}
.lp-orient figcaption{font-size:12px;line-height:1.45;color:var(--ink-2);text-align:center}
.lp-orient figcaption b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.lp-kind h2{margin-top:32px}
.lp-lays{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end}
.lp-lay{margin:0;display:flex;flex-direction:column;gap:6px;width:max-content;min-width:96px}
.lp-laybox{display:flex;align-items:flex-end}
.lp-lay figcaption{display:flex;flex-direction:column;gap:3px}
.lp-lay figcaption b{font:500 14px/1 "IBM Plex Mono",monospace}
.lp-lay figcaption span{font:400 10.5px/1.35 "IBM Plex Mono",monospace;color:var(--ink-3);white-space:nowrap}
</style>
</helmet>
