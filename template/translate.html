<main id="translationApp">
<div class="tr-heading"><h1 data-tt="comm.tr.title">Translations</h1><label class="tr-sr" for="trLanguage" data-tt="comm.tr.language">Translation language</label><select id="trLanguage">__LANG_OPTIONS__</select></div>
<div class="tr-tools"><label class="tr-sr" for="trSearch" data-tt="comm.tr.searchLabel">Search phrases</label><input id="trSearch" type="search" placeholder="Search phrases…" data-tt-placeholder="comm.tr.searchPlaceholder" autocomplete="off"><label class="tr-sr" for="trFilter" data-tt="comm.tr.filterLabel">Filter translations</label><select id="trFilter"><option value="all" data-tt="comm.tr.all">All phrases</option><option value="missing" data-tt="comm.tr.missingFilter">Untranslated</option><option value="draft" data-tt="comm.tr.draftFilter">Drafts</option><option value="community" data-tt="comm.tr.communityFilter">Community</option></select><label class="tr-sr" for="trArea" data-tt="comm.tr.areaLabel">Page or area</label><select id="trArea"><option value="" data-tt="comm.tr.allAreas">All areas</option></select><span id="trCount" class="tr-count"></span></div>

<div class="tr-table"><div class="tr-columns" aria-hidden="true"><span data-tt="comm.tr.english">English</span><span id="trTargetHeading"></span><span data-tt="comm.tr.votes">Votes</span><span></span></div><div id="trRows" aria-busy="true"></div></div>
