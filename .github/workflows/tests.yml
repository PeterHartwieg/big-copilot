# Tests only: nothing here builds for release or deploys.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # A newer push to a pull request replaces its run; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python suite
    runs-on: ubuntu-latest
    outputs:
      freshness: ${{ steps.freshness.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # tests/test_plan_orders.py runs the board script under Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Share this runner with the short freshness checks. Keep their own
      # outcome so the stable freshness check does not depend on Python tests.
      - name: Verify assembly and freshness
        id: freshness
        run: |
          npm run verify:assemble
          git diff --exit-code --stat
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
          npm run verify:check
      # The site under web/ is not committed; several suites read it.
      - run: npm run test:python

  node-tests:
    name: Node (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      # Collect all failures instead of cancelling the other suites.
      fail-fast: false
      matrix:
        suite: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8']
    steps:
      - uses: actions/checkout@v7
      # Some suites write fixture saves and serve the game-link mock with Python.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
      # The site under web/ is not committed; several suites serve or read it.
      # npm test assembles first and includes the community suites.
      - name: Test Node shard
        run: npm test -- --shard=${{ matrix.suite }}
      # This lighter shard has room for the hosted-page and bundle checks.
      - name: Test the optimized hosted page
        if: matrix.suite == '6/8'
        run: npm run test:optimized
      - name: Check the Worker bundle
        if: matrix.suite == '6/8'
        run: npm run check:worker

  # Preserve the existing check name for branch rules. A failed, cancelled or
  # skipped matrix must never turn this aggregate check green.
  node:
    name: Node suites
    runs-on: ubuntu-latest
    needs: node-tests
    if: always()
    steps:
      - name: Require every Node lane
        env:
          RESULT: ${{ needs.node-tests.result }}
        run: test "$RESULT" = success

  web-fresh:
    name: web/ assembles from its sources
    runs-on: ubuntu-latest
    needs: python
    if: always()
    steps:
      - name: Require assembly and freshness checks
        env:
          RESULT: ${{ needs.python.outputs.freshness }}
        run: test "$RESULT" = success
