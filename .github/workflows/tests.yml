# Tests only: nothing here builds for release or deploys.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # A newer push to a pull request replaces its run; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Python and Node lanes take their suites from tests/shard-weights.json
  # (tools/verify.mjs assignShards; refresh with tools/shard_weights.mjs).
  # Six Node lanes, two Python lanes and freshness: nine runners per run, so
  # two runs fit in the 20 GitHub-hosted slots.
  python:
    name: Python (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # tests/test_plan_orders.py runs the board script under Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The site under web/ is not committed; several suites read it.
      - run: npm run test:python -- --shard=${{ matrix.shard }}

  node-tests:
    name: Node (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      # Collect all failures instead of cancelling the other suites.
      fail-fast: false
      matrix:
        suite: ['1/6', '2/6', '3/6', '4/6', '5/6', '6/6']
    steps:
      - uses: actions/checkout@v7
      # Some suites write fixture saves and serve the game-link mock with Python.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      # No --with-deps: its apt-get cost every lane 13-20 s and once stalled a
      # lane 16 min on the Ubuntu mirror (#336). The runner image already has
      # the libraries the headless shell needs (a missing one fails the browser
      # launch loudly), but no font that draws Korean, which the i18n expansion
      # suite measures with real glyphs. Install just that font, with bounded
      # attempts, and check it is there.
      - run: npx playwright install --only-shell chromium
      - name: Install a Korean font
        run: |
          for attempt in 1 2 3; do
            timeout 120 sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei && break
            timeout 120 sudo apt-get update -qq || true
          done
          fc-list :lang=ko | grep -q . || { echo "no Korean font installed"; exit 1; }
      # The site under web/ is not committed; several suites serve or read it.
      # npm test assembles first and includes the community suites.
      - name: Test Node shard
        run: npm test -- --shard=${{ matrix.suite }}
      # Keep the short deployment smoke and bundle check on one existing runner.
      - name: Smoke test the optimized hosted page
        if: matrix.suite == '6/6'
        run: npm run test:optimized
      - name: Check the Worker bundle
        if: matrix.suite == '6/6'
        run: npm run check:worker

  # Preserve the existing check name for branch rules. A failed, cancelled or
  # skipped matrix must never turn this aggregate check green.
  node:
    name: Node suites
    runs-on: ubuntu-latest
    needs: node-tests
    if: always()
    steps:
      - name: Require every Node lane
        env:
          RESULT: ${{ needs.node-tests.result }}
        run: test "$RESULT" = success

  python-suite:
    name: Python suite
    runs-on: ubuntu-latest
    needs: python
    if: always()
    steps:
      - name: Require every Python lane
        env:
          RESULT: ${{ needs.python.result }}
        run: test "$RESULT" = success

  # Its own runner, so the stable freshness check never depends on the tests.
  web-fresh:
    name: web/ assembles from its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify assembly and freshness
        run: |
          npm run verify:assemble
          git diff --exit-code --stat
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
          npm run verify:check
