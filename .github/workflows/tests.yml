# Tests only: nothing here builds for release or deploys.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # A newer push to a pull request replaces its run; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # tests/test_plan_orders.py runs the board script under Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The site under web/ is not committed; several suites read it.
      - run: npm run test:python

  node:
    name: Node suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Some suites write fixture saves and serve the game-link mock with Python.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # The site under web/ is not committed; several suites serve or read it.
      # npm test assembles first and includes the community suites.
      - run: npm test
      - name: Test the optimized hosted page
        run: npm run test:optimized
      - run: npm run check:worker

  web-fresh:
    name: web/ assembles from its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Needs no installed game. Assembling must leave every committed file as it
      # is (a stale web/wiki-data.json article shows up here) and write nothing
      # .gitignore does not cover; --check then holds the result to the sources.
      - run: npm run verify:assemble
      - name: Assembling changed no committed file and left nothing untracked
        run: |
          git diff --exit-code --stat
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - run: npm run verify:check
